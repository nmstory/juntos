name: Juntos CI

# For every push on every branch/PR
on:
  push:
    branches: '**'
  pull_request:
    branches: '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: setup
      run: |
        sudo apt-get update
        sudo apt install cmake llvm-16
    - name: compile
      run: |
        rm -Rf build/
        mkdir build/
        cd build/
        cmake ..
        make
    - name: Process clang-tidy warnings
      uses: asarium/clang-tidy-action@v1
      with:
        fixesFile: clang-fixes.yaml

  sanitizers:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: setup
      run: |
        sudo apt-get update
        sudo apt install cmake clang
    - name: build with ASan + UBSan
      run: |
        rm -Rf build/
        mkdir build/
        cd build/
        cmake -DCMAKE_CXX_COMPILER=clang++ -DJUNTOS_BUILD_TESTS=ON -DJUNTOS_SANITIZERS=ON ..
        make
    - name: run tests
      run: cd build && ctest --output-on-failure
      env:
        ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
        UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  clang-format-checking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: RafikFarhad/clang-format-github-action@v3
        with:
          sources: "src/**/*.h,src/**/*.c,test/**/*.c"

  